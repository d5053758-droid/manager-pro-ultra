<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07151d"><meta name="description" content="Manager Pro Ultra para PES 2014 Liga Máster">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<title>Manager Pro Ultra</title>
<style>body{margin:0;background:#07151d;color:#eff8f6;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}.load{max-width:340px;padding:28px;text-align:center;background:#102630;border:1px solid #294b55;border-radius:20px;margin:18px}.load img{width:64px}.load p{color:#9bb6bb;font-size:13px;line-height:1.5}</style>
</head><body><div class="load" id="loading"><img src="./icons/icon.svg" alt=""><h2>MANAGER PRO ULTRA</h2><p>Preparando nuestro centro táctico…</p></div>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
(async()=>{const response=await fetch('./app.html.gz');if(!response.ok)throw new Error('No se pudo cargar la aplicación ('+response.status+').');if(!('DecompressionStream' in window))throw new Error('Actualiza Chrome para abrir la aplicación.');const stream=response.body.pipeThrough(new DecompressionStream('gzip'));const source=await new Response(stream).text();const doc=new DOMParser().parseFromString(source,'text/html');document.title=doc.title;doc.head.querySelectorAll('style').forEach(s=>document.head.append(s.cloneNode(true)));document.body.innerHTML=doc.body.innerHTML;document.querySelectorAll('script').forEach(old=>{const s=document.createElement('script');s.textContent=old.textContent;old.replaceWith(s);});})().catch(e=>{document.getElementById('loading').innerHTML='<h2>No se pudo abrir la app</h2><p>'+String(e.message)+'</p><p>Comprueba tu conexión y vuelve a cargar la página.</p>';});
</script></body></html>
